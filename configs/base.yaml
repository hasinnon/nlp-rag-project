phase: 1
description: "Initial closed-book and passage-level RAG baselines"

seed: 42

models:
  llm: Qwen/Qwen2.5-3B-Instruct
  embedder: BAAI/bge-small-en-v1.5

generation:
  load_in_4bit: true
  max_input_tokens: 3072
  max_new_tokens: 64

retrieval:
  top_k: 10
  context_k: 5
  embedding_batch_size: 64
  embedding_device: cpu
  query_prefix: "Represent this sentence for searching relevant passages: "
  rrf_k: 60

prompts:
  rag: prompts/rag.txt
  closed_book: prompts/closed_book.txt